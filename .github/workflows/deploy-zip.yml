name: Site auto-deploy (ZIP + domain guard + sitemap + AdSense + IndexNow)

# Kab chalega:
#  - main branch par HAR push par (site.zip upload ho ya koi single file edit)
#  - Actions tab -> "Run workflow" button se (bina zip ke bhi safe hai)
# Bot ka apna commit "[skip ci]" ke saath GITHUB_TOKEN se push hota hai,
# isliye ye workflow khud ko dobara trigger nahi karta.
# Naya (khali) repo: pehle site.zip upload karo ya pehle ye workflow — dono order chalte hain.
# Repo me site na ho to ye run kuch nahi badalta, sirf notice dikhata hai (green rahega).
#
# ---------------- SETTINGS (sirf repo Settings se, file edit karne ki zarurat nahi) ----------------
#  AdSense:  Settings -> Secrets and variables -> Actions -> "Variables" tab -> New repository variable
#            Name: ADSENSE_PUB_ID    Value: pub-1234567890123456   (AdSense account ka publisher ID)
#            -> har page ke <head> me AdSense code + verification meta tag, aur ads.txt me Google ki line
#            apne aap lag jayegi. Variable hata do -> sab apne aap hat jayega.
#  Search Console (purani github.io property ka "HTML tag" verification, Change of Address ke liye):
#            Variable Name: GOOGLE_SITE_VERIFICATION   Value: meta tag ka content token (ya poora <meta ...> tag)
#            -> homepage ke <head> me <meta name="google-site-verification" ...> apne aap lag jayega.
#  IndexNow: kuch set nahi karna. Bing/Yandex ko badle hue pages apne aap bata diye jaate hain.
# -----------------------------------------------------------------------------------------------------
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "IndexNow (Bing/Yandex) ko sitemap ke SAARE URLs bhejein? (pehli baar launch par 'true')"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-zip
  cancel-in-progress: false

env:
  # Custom domain — CNAME file aur sab canonical/sitemap URLs isi se banenge.
  # Domain kabhi badle to sirf yeh ek line badlein.
  SITE_DOMAIN: gyantools.in
  ADSENSE_PUB_ID: ${{ vars.ADSENSE_PUB_ID }}
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo (poori history — sitemap lastmod ke liye)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Trigger wala purana commit nahi, branch ka LATEST state lo — taaki pichhle run ka
          # bot-commit bhi shaamil ho aur push me conflict na aaye (runs ek-ek karke chalte hain)
          ref: ${{ github.ref_name }}

      - name: Workflow file poori hai? (copy-paste kat to nahi gaya)
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          f=$(printf '%s' "$WORKFLOW_REF" | sed -E 's#^[^/]+/[^/]+/##; s#@.*$##')
          [ -f "$f" ] || f=.github/workflows/deploy-zip.yml
          if ! grep -q '^# gt:workflow-end' "$f"; then
            echo "::error::$f ADHOORI hai - copy-paste beech me kat gaya (mobile par ~20,000 akshar ki limit hoti hai). Copy-paste mat karo: poori deploy-zip.yml file ko 'Add file > Upload files' se .github/workflows/ folder me upload karo."
            exit 1
          fi
          echo "Workflow file poori hai: $f"

      - name: Is push me badli files yaad rakho (IndexNow ke liye)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          : > /tmp/pushed_files.txt
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git -c core.quotepath=off diff --name-only "$BEFORE" "$AFTER" > /tmp/pushed_files.txt 2>/dev/null || true
          fi
          echo "Is push me badli files: $(wc -l < /tmp/pushed_files.txt)"

      - name: Root zips dhundho
        id: zip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          echo "count=${#zips[@]}" >> "$GITHUB_OUTPUT"
          echo "Root me zips: ${#zips[@]}"
          # Naya/khali repo (na zip, na index.html) -> kuch mat karo, sirf bata do (run green rahega)
          if [ "${#zips[@]}" -gt 0 ] || [ -f index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repo me abhi site nahi hai (na site.zip, na index.html). site.zip upload karein - upload hote hi ye workflow apne aap site laga dega."
          fi

      - name: Sabhi root zips extract karo
        if: steps.zip.outputs.count != '0'
        run: |
          shopt -s nullglob
          zips=(*.zip)
          rm -rf _site _tmp
          mkdir -p _site
          # Zips alphabetical order me extract hoti hain — apni zip ka naam 'site.zip' rakhein.
          for z in "${zips[@]}"; do
            echo "Extract ho rahi hai: $z"
            rm -rf _tmp && mkdir _tmp
            unzip -q -o "$z" -d _tmp
            # Agar zip ke andar sab kuch ek hi folder me hai, to us folder ke andar se lo
            entries=$(find _tmp -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$entries" -eq 1 ] && [ -d "$(find _tmp -mindepth 1 -maxdepth 1)" ]; then
              inner=$(find _tmp -mindepth 1 -maxdepth 1 -type d)
              cp -a "$inner"/. _site/
            else
              cp -a _tmp/. _site/
            fi
          done
          rm -rf _tmp
          # Zip ka .github/.git humari workflow/history ko overwrite na kare,
          # aur zip ka CNAME custom domain ko na bigaade (repo wala CNAME hi rahega)
          rm -rf _site/.github _site/.git
          rm -f _site/CNAME
          N=$(find _site -name '*.html' | wc -l)
          echo "Extract ke baad HTML pages: $N"
          if [ "$N" -lt 50 ]; then
            echo "EXTRACT GALAT LAG RAHA HAI (sirf $N pages mile, 50+ chahiye) — rok rahe hain."
            exit 1
          fi

      - name: Purani site hatao, nayi lagao
        if: steps.zip.outputs.count != '0'
        run: |
          # DELETE se SAFE: .git, .github (yehi workflow), CNAME (custom domain),
          # google*.html (Search Console verification), zips, _site, repo docs
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'CNAME' \
            ! -name 'google*.html' \
            ! -name '*.zip' \
            ! -name '_site' \
            ! -name 'README.md' \
            ! -name '.gitignore' \
            ! -name 'LICENSE' \
            ! -name 'AUDIT-REPORT.md' \
            -exec rm -rf {} +
          cp -a _site/. ./
          rm -rf _site
          rm -f *.zip
          echo "Final HTML pages: $(find . -name '*.html' -not -path './.git/*' | wc -l)"

      - name: Domain guard (CNAME + purane github.io URL -> custom domain)
        if: steps.zip.outputs.ready == 'true'
        run: |
          python3 - <<'PYEOF'
          import os, re
          D = os.environ['SITE_DOMAIN']
          # 1) CNAME hamesha sahi rahe — CNAME file hatne par GitHub custom domain hata deta hai
          cur = open('CNAME', encoding='utf-8').read().strip() if os.path.exists('CNAME') else ''
          if cur != D:
              open('CNAME', 'w', encoding='utf-8').write(D + '\n')
              print('CNAME theek kiya ->', D)
          # 2) Kisi bhi site file me purana gyantools.github.io URL ho to custom domain kar do
          #    (repo ka naam github.com/gyantools/gyantools.github.io waise hi rehta hai)
          OLD = re.compile(r'(?<!github\.com/gyantools/)gyantools\.github\.io')
          EXT = ('.html', '.htm', '.js', '.css', '.xml', '.txt', '.json', '.webmanifest')
          fixed = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github', 'node_modules')]
              for fn in files:
                  if not fn.endswith(EXT):
                      continue
                  p = os.path.join(root, fn)
                  try:
                      s = open(p, encoding='utf-8').read()
                  except (UnicodeDecodeError, OSError):
                      continue
                  t = OLD.sub(D, s)
                  if t != s:
                      open(p, 'w', encoding='utf-8').write(t)
                      fixed += 1
                      print('  domain fix:', p)
          print('Domain guard: files theek kiye =', fixed)
          PYEOF

      - name: Google AdSense code (repo variable ADSENSE_PUB_ID se) + ads.txt
        if: steps.zip.outputs.ready == 'true'
        run: |
          python3 - <<'PYEOF'
          import os, re
          raw = (os.environ.get('ADSENSE_PUB_ID') or '').strip()
          m = re.fullmatch(r'(?:ca-)?(?:pub-)?(\d{16})', raw)
          if raw and not m:
              print('::warning::ADSENSE_PUB_ID galat format me hai (%r). Sahi format: pub-1234567890123456 — abhi AdSense code NAHI lagaya.' % raw)
          pub = m.group(1) if m else None
          A, B = '<!-- gt:adsense:start -->', '<!-- gt:adsense:end -->'
          BLOCK = re.compile(r'\n?' + re.escape(A) + r'.*?' + re.escape(B), re.S)
          if pub:
              snippet = ('\n' + A + '\n<meta name="google-adsense-account" content="ca-pub-%s">\n'
                         '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-%s" '
                         'crossorigin="anonymous"></script>\n' + B) % (pub, pub)
          changed = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github', 'node_modules', '_site')]
              for fn in files:
                  if not fn.endswith('.html'):
                      continue
                  p = os.path.join(root, fn)
                  rel = os.path.relpath(p).replace(os.sep, '/')
                  s = open(p, encoding='utf-8', errors='replace').read()
                  t = BLOCK.sub('', s)
                  skip = (rel == '404.html' or ('/' not in rel and fn.startswith('google'))
                          or re.search(r'<meta[^>]*name=["\']robots["\'][^>]*noindex', t[:8000], re.I)
                          or '</head>' not in t)
                  if pub and not skip:
                      t = t.replace('</head>', snippet.lstrip('\n') + '\n</head>', 1)
                  if t != s:
                      open(p, 'w', encoding='utf-8').write(t)
                      changed += 1
          print('AdSense:', ('ON  (ca-pub-%s)' % pub) if pub else 'OFF (variable set nahi hai)', '| pages updated =', changed)
          # ads.txt — Google wali line sirf tab, jab pub ID set ho
          lines = open('ads.txt', encoding='utf-8').read().splitlines() if os.path.exists('ads.txt') else []
          lines = [l for l in lines if not l.strip().lower().startswith('google.com,')]
          while lines and not lines[-1].strip():
              lines.pop()
          if pub:
              lines += ['', 'google.com, pub-%s, DIRECT, f08c47fec0942fa0' % pub]
          new = '\n'.join(lines) + '\n'
          old = open('ads.txt', encoding='utf-8').read() if os.path.exists('ads.txt') else ''
          if new != old:
              open('ads.txt', 'w', encoding='utf-8').write(new)
              print('ads.txt update hua')
          PYEOF

      - name: Search Console HTML-tag verification (repo variable GOOGLE_SITE_VERIFICATION se)
        if: steps.zip.outputs.ready == 'true'
        run: |
          python3 - <<'PYEOF'
          import os, re
          raw = (os.environ.get('GOOGLE_SITE_VERIFICATION') or '').strip()
          # Poora <meta ... content="TOKEN"> paste kiya ho to bhi chalega; kai tokens comma/space se
          toks = re.findall(r'content=["\']([^"\']+)["\']', raw) or re.split(r'[\s,]+', raw)
          toks = [t for t in toks if re.fullmatch(r'[A-Za-z0-9_-]{20,100}', t)]
          A, B = '<!-- gt:gsv:start -->', '<!-- gt:gsv:end -->'
          BLOCK = re.compile(r'\n?' + re.escape(A) + r'.*?' + re.escape(B), re.S)
          if raw and not toks:
              print('::warning::GOOGLE_SITE_VERIFICATION ka token samajh nahi aaya — sirf content="..." wala hissa daalein.')
          p = 'index.html'
          if os.path.exists(p):
              s = open(p, encoding='utf-8').read()
              t = BLOCK.sub('', s)
              if toks:
                  tags = '\n'.join('<meta name="google-site-verification" content="%s">' % x for x in dict.fromkeys(toks))
                  t = t.replace('</head>', A + '\n' + tags + '\n' + B + '\n</head>', 1)
              if t != s:
                  open(p, 'w', encoding='utf-8').write(t)
              print('Search Console meta tags:', len(toks))
          PYEOF

      - name: Sitemap (XML + HTML) + robots.txt sync
        if: steps.zip.outputs.ready == 'true'
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, datetime, html
          D = os.environ['SITE_DOMAIN']
          BASE = 'https://%s/' % D
          today = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')

          # Is run me badli/nayi files -> lastmod = aaj; baaki files -> unka aakhri git commit date.
          st = subprocess.run(['git', '-c', 'core.quotepath=off', 'status', '--porcelain', '--untracked-files=all'],
                              capture_output=True, text=True).stdout
          changed = set()
          for line in st.splitlines():
              path = line[3:].strip().strip('"')
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)

          def lastmod(rel):
              if rel in changed:
                  return today
              out = subprocess.run(['git', 'log', '-1', '--format=%cs', '--', rel],
                                   capture_output=True, text=True).stdout.strip()
              return out or today

          CANON = [re.compile(r'<link[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)["\']', re.I),
                   re.compile(r'<link[^>]*href=["\']([^"\']+)["\'][^>]*rel=["\']canonical["\']', re.I)]
          entries = {}
          groups = {'tools': [], 'blog': [], 'games': [], 'pages': []}
          for root, dirs, fns in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github', '_site', 'node_modules')]
              for fn in fns:
                  if not fn.endswith('.html') or fn == '404.html':
                      continue
                  path = os.path.join(root, fn)
                  rel = os.path.relpath(path).replace(os.sep, '/')
                  if '/' not in rel and fn.startswith('google'):
                      continue  # Search Console verification file
                  try:
                      full = open(path, encoding='utf-8', errors='replace').read()
                  except OSError:
                      continue
                  head = full[:12000]
                  if re.search(r'<meta[^>]*name=["\']robots["\'][^>]*noindex', head, re.I):
                      continue  # noindex pages (redirect stubs) sitemap me nahi
                  url = None
                  for rx in CANON:
                      m = rx.search(head)
                      if m:
                          url = m.group(1).strip()
                          break
                  if not url or not url.startswith(BASE):
                      url = BASE if rel == 'index.html' else BASE + rel
                  entries[url] = lastmod(rel)
                  # HTML sitemap ke liye page ka naam (H1, warna title)
                  if rel != 'sitemap.html':
                      m = re.search(r'<h1[^>]*>(.*?)</h1>', full, re.S)
                      t = re.sub(r'<[^>]+>', '', m.group(1)) if m else ''
                      if not t.strip():
                          m = re.search(r'<title>(.*?)</title>', full, re.S)
                          t = m.group(1) if m else rel
                      t = html.unescape(re.sub(r'\s+', ' ', t)).strip()
                      t = re.sub(r'^[^\w]+', '', t).strip() or rel
                      sec = rel.split('/')[0] if '/' in rel else 'pages'
                      if sec not in groups:
                          sec = 'pages'
                      link = '/' + rel
                      if link.endswith('/index.html'):
                          link = link[:-len('index.html')]
                      if link == '/index.html':
                          link = '/'
                      groups[sec].append((t, link))

          out = ['<?xml version="1.0" encoding="UTF-8"?>',
                 '<!-- Yeh sitemap workflow khud banata hai (URL = har page ka canonical, lastmod = aakhri badlav) -->',
                 '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in sorted(entries):
              home = (u == BASE)
              out += ['  <url>',
                      '    <loc>%s</loc>' % u,
                      '    <lastmod>%s</lastmod>' % entries[u],
                      '    <changefreq>%s</changefreq>' % ('weekly' if home else 'monthly'),
                      '    <priority>%s</priority>' % ('1.0' if home else '0.8'),
                      '  </url>']
          out.append('</urlset>')
          new_xml = '\n'.join(out) + '\n'
          old_xml = open('sitemap.xml', encoding='utf-8').read() if os.path.exists('sitemap.xml') else ''
          if new_xml != old_xml:
              open('sitemap.xml', 'w', encoding='utf-8').write(new_xml)
          print('SITEMAP: total URLs =', len(entries))
          if len(entries) < 50:
              raise SystemExit('Sitemap bahut chhota lag raha hai (%d URLs) — rok rahe hain.' % len(entries))

          # HTML sitemap (sitemap.html) — sirf markers ke beech ka hissa dobara banta hai
          if os.path.exists('sitemap.html'):
              s = open('sitemap.html', encoding='utf-8').read()
              a, b = '<!-- gt:sitemap:start -->', '<!-- gt:sitemap:end -->'
              i, j = s.find(a), s.find(b)
              if i != -1 and j != -1:
                  names = [('tools', '🧰 टूल्स और कैलकुलेटर'), ('blog', '📖 हिंदी गाइड्स'),
                           ('games', '🎮 गेम्स'), ('pages', 'ℹ️ GyanTools के ज़रूरी पेज')]
                  blk = ['<div class="gt-sitemap">']
                  for key, label in names:
                      items = sorted(groups[key], key=lambda x: (not x[1].endswith('/'), x[0].lower()))
                      blk.append('<h2>%s (%d)</h2>' % (label, len(items)))
                      blk.append('<ul>')
                      for t, u in items:
                          blk.append('<li><a href="%s">%s</a></li>' % (u, html.escape(t, quote=False)))
                      blk.append('</ul>')
                  blk.append('</div>')
                  new = s[:i + len(a)] + '\n' + '\n'.join(blk) + '\n' + s[j:]
                  if new != s:
                      open('sitemap.html', 'w', encoding='utf-8').write(new)
                      print('sitemap.html update hua')

          # robots.txt — Sitemap line hamesha custom domain wali
          want = 'Sitemap: %ssitemap.xml' % BASE
          r = open('robots.txt', encoding='utf-8').read() if os.path.exists('robots.txt') else 'User-agent: *\nAllow: /\n'
          lines = [l for l in r.splitlines() if not l.lower().startswith('sitemap:')]
          while lines and not lines[-1].strip():
              lines.pop()
          new_r = '\n'.join(lines) + '\n\n' + want + '\n'
          if new_r != r:
              open('robots.txt', 'w', encoding='utf-8').write(new_r)
              print('robots.txt Sitemap line theek ki')
          PYEOF

      - name: IndexNow key file pakki karo
        if: steps.zip.outputs.ready == 'true'
        id: inkey
        run: |
          python3 - <<'PYEOF'
          import os, re, secrets
          key = None
          for fn in sorted(os.listdir('.')):
              m = re.fullmatch(r'([0-9a-f]{32})\.txt', fn)
              if m and open(fn, encoding='utf-8').read().strip() == m.group(1):
                  key = m.group(1)
                  break
          if not key:
              key = secrets.token_hex(16)
              open(key + '.txt', 'w', encoding='utf-8').write(key)
              print('Nayi IndexNow key file bani:', key + '.txt')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('key=%s\n' % key)
          print('IndexNow key file:', key + '.txt')
          PYEOF

      - name: Commit aur push karo
        if: steps.zip.outputs.ready == 'true'
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.quotepath=off status --porcelain --untracked-files=all | sed 's/^...//; s/^"//; s/"$//; s/.* -> //' > /tmp/bot_files.txt
          git add -A
          PAGES=$(find . -name '*.html' -not -path './.git/*' | wc -l)
          if git diff --cached --quiet; then
            echo "Koi change nahi — site pehle se updated hai."
            echo "### ✅ Site pehle se updated hai ($PAGES pages) — koi naya commit nahi chahiye" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Auto-deploy: site sync ($PAGES pages, $SITE_DOMAIN) [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "Push fail — rebase karke dobara try ($i)"
              git pull --rebase || true
            done
            if [ "$ok" != 1 ]; then
              echo "::error::Site ka commit push NAHI hua. Settings > Actions > General > Workflow permissions > 'Read and write permissions' > Save, phir is run par 'Re-run all jobs' dabao."
              exit 1
            fi
            echo "### ✅ Nayi site push ho gayi ($PAGES pages) — GitHub Pages 1-3 minute me live karega" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: IndexNow ping (Bing, Yandex, Naver, Seznam, Yep) — Google is support nahi karta
        if: steps.zip.outputs.ready == 'true'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ steps.inkey.outputs.key }}
          INDEXNOW_ALL: ${{ github.event.inputs.indexnow_all }}
        run: |
          python3 - <<'PYEOF'
          import os, re, json, time, urllib.request, urllib.error
          D = os.environ['SITE_DOMAIN']; BASE = 'https://%s/' % D
          key = os.environ['INDEXNOW_KEY']
          urls = set()
          if (os.environ.get('INDEXNOW_ALL') or '').lower() == 'true':
              sm = open('sitemap.xml', encoding='utf-8').read() if os.path.exists('sitemap.xml') else ''
              urls.update(re.findall(r'<loc>([^<]+)</loc>', sm))
          files = set()
          for f in ('/tmp/pushed_files.txt', '/tmp/bot_files.txt'):
              if os.path.exists(f):
                  files.update(l.strip() for l in open(f, encoding='utf-8') if l.strip())
          for rel in files:
              if not rel.endswith('.html') or rel == '404.html' or not os.path.exists(rel):
                  continue
              if '/' not in rel and rel.startswith('google'):
                  continue
              head = open(rel, encoding='utf-8', errors='replace').read(12000)
              if re.search(r'<meta[^>]*name=["\']robots["\'][^>]*noindex', head, re.I):
                  continue
              m = re.search(r'<link[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)["\']', head, re.I)
              u = m.group(1) if m and m.group(1).startswith(BASE) else (BASE if rel == 'index.html' else BASE + rel)
              urls.add(u)
          urls = sorted(urls)[:10000]
          if not urls:
              print('IndexNow: koi naya/badla page nahi — ping ki zarurat nahi.')
              raise SystemExit(0)
          key_url = BASE + key + '.txt'
          print('IndexNow: %d URLs. Key file live hone ka intezaar: %s' % (len(urls), key_url))
          live = False
          for i in range(20):  # ~10 minute tak (GitHub Pages deploy me 1-3 minute lagte hain)
              time.sleep(30)
              try:
                  with urllib.request.urlopen(urllib.request.Request(key_url, headers={'Cache-Control': 'no-cache'}), timeout=20) as r:
                      if r.read().decode('utf-8', 'replace').strip() == key:
                          live = True
                          break
              except Exception as e:
                  print('  abhi live nahi (%s) — 30 sec baad dobara...' % e)
          if not live:
              print('::warning::IndexNow key file live nahi hui — is baar ping skip. Agle deploy par apne aap ho jayega.')
              raise SystemExit(0)
          time.sleep(30)  # badle pages bhi deploy ho jayein
          body = json.dumps({'host': D, 'key': key, 'keyLocation': key_url, 'urlList': urls}).encode('utf-8')
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, method='POST',
                                       headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print('IndexNow response:', r.status, '(200/202 = mil gaya)')
          except urllib.error.HTTPError as e:
              print('::warning::IndexNow HTTP %s: %s' % (e.code, e.read()[:300]))
          for u in urls[:30]:
              print('  ', u)
          if len(urls) > 30:
              print('   ... aur %d' % (len(urls) - 30))
          PYEOF

